name: SeriousiOS iPhoneOS Platform Probe

on:
  push:
    branches:
      - main
      - agent/**
  pull_request:
  workflow_dispatch:

concurrency:
  group: seriousios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compile-base-platform:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Checkout SeriousiOS
        uses: actions/checkout@v4

      - name: Load pinned revisions
        shell: bash
        run: cat Dependencies.lock >> "$GITHUB_ENV"

      - name: Validate patch tooling
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/apply_upstream_patches.sh
          python3 -m py_compile scripts/transform_sources_for_ios.py
          python3 -m py_compile scripts/transform_ios_host_for_diagnostics.py

      - name: Checkout pinned SeriousSamClassic
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none "$SERIOUSSAMCLASSIC_REPOSITORY" upstream/SeriousSamClassic
          git -C upstream/SeriousSamClassic checkout --detach "$SERIOUSSAMCLASSIC_COMMIT"
          test "$(git -C upstream/SeriousSamClassic rev-parse HEAD)" = "$SERIOUSSAMCLASSIC_COMMIT"

      - name: Apply SeriousiOS source portability layer
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p artifacts
          overall_status=0
          bash scripts/apply_upstream_patches.sh upstream/SeriousSamClassic \
            2>&1 | tee artifacts/ios-platform-patches.log || overall_status=1
          python3 scripts/transform_sources_for_ios.py upstream/SeriousSamClassic \
            2>&1 | tee artifacts/ios-platform-source-transform.log || overall_status=1
          if [[ -f upstream/SeriousSamClassic/seriousios-patches.manifest ]]; then
            cp upstream/SeriousSamClassic/seriousios-patches.manifest artifacts/
          fi
          exit "$overall_status"

      - name: Compile engine platform probe for arm64 iPhoneOS
        shell: bash
        run: |
          set -euo pipefail
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          CXX=$(xcrun --sdk iphoneos --find clang++)
          mkdir -p artifacts

          {
            echo "sdk=$SDK_PATH"
            echo "compiler=$($CXX --version | head -n 1)"
            echo "target=arm64-apple-ios15.0"
            cat upstream/SeriousSamClassic/seriousios-patches.manifest
            cat artifacts/ios-platform-source-transform.log
          } | tee artifacts/ios-platform-probe.txt

          overall_status=0
          for encounter in TFE TSE; do
            log="artifacts/ios-platform-${encounter}.log"
            set +e
            "$CXX" \
              -target arm64-apple-ios15.0 \
              -isysroot "$SDK_PATH" \
              -std=c++14 \
              -fms-extensions \
              -Wall -Wextra -Werror \
              -Wno-unused-parameter \
              -DUSE_PORTABLE_C=1 \
              -DPRAGMA_ONCE=1 \
              -I "upstream/SeriousSamClassic/Sam${encounter}/Sources" \
              -fsyntax-only Tests/IOSPlatformProbe.cpp \
              2>&1 | tee "$log"
            compile_status=${PIPESTATUS[0]}
            set -e

            if [[ $compile_status -eq 0 ]]; then
              echo "Sam${encounter}: platform probe passed" | tee -a artifacts/ios-platform-probe.txt
            else
              echo "Sam${encounter}: platform probe failed with status ${compile_status}" \
                | tee -a artifacts/ios-platform-probe.txt
              overall_status=1
            fi
          done
          exit "$overall_status"

      - name: Upload iPhoneOS platform evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seriousios-iphoneos-platform-${{ github.sha }}
          path: artifacts
          if-no-files-found: warn
          retention-days: 14
